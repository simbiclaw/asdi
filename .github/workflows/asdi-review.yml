# ASDI review merge gate. No stored secrets.
#
# OWNER OVERRIDE (DD-48, 2026-11-18): REV K C-1 and D-8 keep GitHub passive.
# The owner directed a merge gate on new PRs, with the review done by Claude
# and no API key stored in the repository. So:
#   - the review is done by Claude in the owner's Claude Code session, which
#     posts one verdict comment per PR, tied to the head commit;
#   - this workflow only reads that verdict and sets the commit status
#     "asdi/review" (pending / success / failure). It runs no model and uses
#     only the built-in, per-run GITHUB_TOKEN.
# Require the status check "asdi/review" in the ruleset for main.
#
# Safety: pull_request_target and issue_comment both run this file from the
# default branch, and the job checks out the default branch. PR code is never
# checked out or executed, so a PR cannot change how its own gate is decided.
name: asdi-review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: asdi-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  status:
    name: evaluate asdi/review
    if: ${{ github.event_name == 'pull_request_target' || github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the default branch (never the PR head)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set the asdi/review status from the trusted verdict
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: python3 archon/gate_status.py --pr "$PR_NUMBER"
